<section class="article-add">

  <div class="page-header">

    <h1>新增文章</h1>

    <p>建立新的美妝部落格文章</p>

  </div>


  <form (ngSubmit)="addArticle()">

    <div class="form-group">

      <label for="title">
        文章標題
      </label>

      <input
        id="title"
        type="text"
        name="title"
        [(ngModel)]="article.title"
        placeholder="請輸入文章標題"
        required>

    </div>


    <div class="form-group">

      <label for="description">
        文章描述
      </label>

      <textarea
        id="description"
        name="description"
        [(ngModel)]="article.description"
        placeholder="請輸入文章描述"
        rows="5"
        required>
      </textarea>

    </div>


    <div class="form-group">

      <label for="category">
        分類
      </label>

      <select
        id="category"
        name="category"
        [(ngModel)]="article.category">

        <option value="trend">
          保養趨勢
        </option>

      </select>

    </div>


    <div class="form-group">

      <label for="date">
        發布日期
      </label>

      <input
        id="date"
        type="date"
        name="date"
        [(ngModel)]="article.date"
        required>

    </div>


    <div class="form-group">

      <label for="image">
        圖片
      </label>

    <input
        id="image"
        type="file"
        accept="image/*"
        (change)="onFileSelected($event)"
    >

    </div>
    @if (imagePreview) {

    <div class="image-preview">

        <p>圖片預覽</p>

        <img
        [src]="imagePreview"
        alt="圖片預覽"
        >

    </div>

    }

    <button type="submit">
      新增文章
    </button>

  </form>

</section>
