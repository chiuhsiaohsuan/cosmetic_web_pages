<section class="article-edit-page">

  <div class="page-header">

    <div>
      <h1>編輯文章</h1>
      <p>修改文章內容</p>
    </div>

  </div>


  <div class="form-card">

    <form (ngSubmit)="saveArticle()">

      <!-- 標題 -->
      <div class="form-group">

        <label for="title">
          文章標題
        </label>

        <input
          id="title"
          type="text"
          [(ngModel)]="article().title"
          name="title"
          placeholder="請輸入文章標題"
        >

      </div>


      <!-- 描述 -->
      <div class="form-group">

        <label for="description">
          文章描述
        </label>

        <textarea
          id="description"
          [(ngModel)]="article().description"
          name="description"
          rows="4"
          placeholder="請輸入文章描述">
        </textarea>

      </div>
      <div class="form-group">

        <label for="context">
          文章內容
        </label>

        <textarea
          id="context"
          [(ngModel)]="article().context"
          name="context"
          rows="4"
          placeholder="請輸入文章內容">
        </textarea>

      </div>

      <!-- 分類 -->
      <div class="form-group">

        <label for="category">
          文章分類
        </label>

        <select
          id="category"
          [(ngModel)]="article().category"
          name="category">

          <option value="">請選擇分類</option>

          <option value="trend">
            趨勢話題
          </option>
          <option value="share">
            美麗分享
          </option>

        </select>

      </div>


      <!-- 日期 -->
      <div class="form-group">

        <label for="date">
          發布日期
        </label>

        <input
          id="date"
          type="date"
          [(ngModel)]="article().date"
          name="date"
        >

      </div>


      <div>
        <label>文章圖片</label>

        <input
          type="file"
          accept="image/*"
          (change)="onImageSelected($event)"
        />

        @if (imagePreview) {

          <div>
            <p>圖片預覽：</p>

            <img
              [src]="imagePreview"
              width="300"
              alt="圖片預覽"
            />
          </div>

        } @else if (article().image) {

          <div>
            <p>目前圖片：</p>

            <img
              [src]="environment.imageUrl + '/uploads/' + article().image"
              width="300"
              alt="目前圖片"
            />
          </div>

        }
      </div>


      <!-- 按鈕 -->
      <div class="form-actions">

        <button
          type="button"
          class="cancel-btn"
          (click)="goBack()">
          取消
        </button>

        <button
          type="submit"
          class="save-btn">
          儲存修改
        </button>

      </div>

    </form>

  </div>

</section>
