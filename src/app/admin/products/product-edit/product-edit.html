<h2>修改商品</h2>


@if(loading()){

<p>載入中...</p>

}

@else{


<form [formGroup]="productForm">


  <input formControlName="name">


  <input formControlName="category">

  <label>價格</label>
  <input type="number" formControlName="price">


  <label>商品主圖</label>
  <input type="file" (change)="onMainImageSelected($event)">

  <label>新增產品特色圖片</label>
  <input type="file" multiple (change)="onDetailImagesSelected($event)">

  <textarea formControlName="specification" placeholder="產品規格"></textarea>
  <textarea formControlName="storage" placeholder="保存方式"></textarea>
  <textarea formControlName="usage" placeholder="使用說明"></textarea>
  <textarea formControlName="notice" placeholder="注意事項"></textarea>

  <label>庫存</label>
  <input type="number" formControlName="stock">


  <label>

      <input type="checkbox" formControlName="isHot">

      熱門

  </label>


  <button type="button" (click)="goBack()">
    回上一頁
  </button>
  <button type="button" (click)="updateProduct()" [disabled]="submitting()">
    {{submitting() ? '修改中...' : '儲存修改'}}
  </button>
</form>
}
