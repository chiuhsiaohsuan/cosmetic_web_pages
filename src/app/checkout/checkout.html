<div class="checkout-container">

    <h2>填寫收件資料</h2>

    <div class="checkout-form">

        <label>
            收件人姓名
        </label>

        <input
            type="text"
            [(ngModel)]="receiverName"
            placeholder="請輸入收件人姓名"
        >

        <label>
            收件人電話
        </label>

        <input
            type="text"
            [(ngModel)]="receiverPhone"
            placeholder="請輸入收件人電話"
        >

        <label>
            收件地址
        </label>

        <input
            type="text"
            [(ngModel)]="receiverAddress"
            placeholder="請輸入收件地址"
        >

        <button (click)="createOrder()">
            送出訂單
        </button>

    </div>

</div>
