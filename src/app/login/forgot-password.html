<div class="forgot-password-container">
  <form class="forgot-password-form" (ngSubmit)="sendResetEmail()">
    <h2>忘記密碼</h2>
    <p>請輸入您註冊時使用的電子郵件，我們會將重設密碼通知寄送給您。</p>

    <div class="input-group">
      <label for="email">電子郵件</label>
      <input
        type="email"
        [(ngModel)]="email"
        id="email"
        name="email"
        placeholder="請輸入 Email"
        required
      >
    </div>

    <button type="submit">發送重設信</button>

    <p class="back-login">
      已記得密碼？
      <a routerLink="/login">返回登入</a>
    </p>
  </form>
</div>
