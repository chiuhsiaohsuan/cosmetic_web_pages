<div class="member-container">

    <h2>會員資料</h2>

    <div class="form-group">

        <label>姓名</label>

        <input type="text" [(ngModel)]="user().name">

    </div>

    <div class="form-group">

        <label>Email</label>

        <input type="email" [(ngModel)]="user().email">

    </div>

    <div class="form-group">

        <label>電話</label>

        <input type="text" [(ngModel)]="user().phone">

    </div>

    <button (click)="updateUser()">儲存修改</button>

</div>
