<header class="header">
    <div class="logo">
        <a
            class="home-link"
            routerLink="/"
            aria-label="首頁"
            (click)="closeMenu()">

            <img src="up-logo.png" alt="承檍生技" class="logo-image logo-symbol">
            <img src="text-logo.png" alt="承檍生技" class="logo-image logo-text">

        </a>
    </div>

    <button
        class="menu-toggle"
        type="button"
        aria-label="開啟選單"
        (click)="toggleMenu()"
        [class.open]="isMenuOpen()">

        <span></span>
        <span></span>
        <span></span>

    </button>

    <nav
        class="menu"
        [class.open]="isMenuOpen()">

        <div class="menu-item">

            <a routerLink="/about" (click)="closeMenu()">
                關於我們
            </a>

            <button
                class="arrow-btn"
                type="button"
                (click)="toggleAbout($event)">
                ⌄
            </button>

            <div
                class="submenu"
                [class.mobile-open]="aboutOpen()">

                <a
                    routerLink="/about/team"
                    (click)="closeMenu()">
                    經營團隊
                </a>

                <a
                    routerLink="/about/vision"
                    (click)="closeMenu()">
                    願景
                </a>

                <a
                    routerLink="/about/location"
                    (click)="closeMenu()">
                    地理位置
                </a>

            </div>

        </div>

        <a
            routerLink="/news"
            (click)="closeMenu()">
            最新消息
        </a>

        <a
            routerLink="/product"
            (click)="closeMenu()">
            商品
        </a>

        <a
            routerLink="/analysis"
            (click)="closeMenu()">
            肌膚檢測
        </a>

        <div class="menu-item">

            <a routerLink="/blog" (click)="closeMenu()">
                部落格
            </a>

            <button
                class="arrow-btn"
                type="button"
                (click)="toggleBlog($event)">
                ⌄
            </button>

            <div
                class="submenu"
                [class.mobile-open]="blogOpen()">

                <a
                    routerLink="/blog"
                    [queryParams]="{ category: 'share' }"
                    (click)="closeMenu()">
                    美麗分享
                </a>

                <a
                    routerLink="/blog"
                    [queryParams]="{ category: 'trend' }"
                    (click)="closeMenu()">
                    趨勢話題
                </a>

            </div>

        </div>

    </nav>

    <div class="top-right">

        @if(isLogin()) {

            <div class="member-menu">

                <button
                    class="member-btn"
                    type="button"
                    (click)="toggleMemberMenu($event)">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 640 640">

                        <path d="M320 312C386.3 312 440 258.3 440 192C440 125.7 386.3 72 320 72C253.7 72 200 125.7 200 192C200 258.3 253.7 312 320 312zM290.3 368C191.8 368 112 447.8 112 546.3C112 562.7 125.3 576 141.7 576L498.3 576C514.7 576 528 562.7 528 546.3C528 447.8 448.2 368 349.7 368L290.3 368z"/>

                    </svg>

                    <span>{{userName}}</span>
                    <span class="member-arrow">
                        {{showMemberMenu ? '⌃' : '⌄'}}
                    </span>

                </button>

                @if(showMemberMenu) {

                    <div
                        class="member-dropdown"
                        (click)="handleMemberDropdownAction($event)">

                        <a routerLink="/member">
                            會員中心
                        </a>

                        <a routerLink="/orders">
                            我的訂單
                        </a>

                        <button
                            class="logout"
                            type="button"
                            (click)="logout()">
                            登出
                        </button>

                    </div>

                }

            </div>

        }
        @else {

            <a
                class="login-link"
                routerLink="/login">
                登入
            </a>

        }

        <a
            class="cart-link"
            routerLink="/cart"
            aria-label="購物車"
            (click)="closeMenu()">

            <svg viewBox="0 0 24 24">

                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.16 14.26c-.75 0-1.41-.41-1.75-1.03L2 4H0V2h3.31l.94 2H22l-3.4 8.34c-.31.76-1.04 1.26-1.86 1.26H7.42l-.9 1.64H20V17H7c-1.52 0-2.48-1.63-1.75-2.97l.91-1.77ZM5.2 6l2.22 5.6h9.32L19.02 6H5.2Z"/>

            </svg>

            @if(cartCount() > 0) {

                <span class="badge">
                    {{cartCount()}}
                </span>

            }

        </a>

    </div>

</header>

@if (isMenuOpen()) {

    <div
        class="menu-backdrop"
        (click)="closeMenu()">
    </div>

}
